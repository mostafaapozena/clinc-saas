services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:4-24-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share MongoDB's network namespace so the database is reachable on localhost:27017
    # and forwarded app ports behave exactly like a local machine.
    network_mode: service:mongo
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.2.12
    restart: unless-stopped
    # Single-node replica set: required for multi-document transactions (organization onboarding).
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      # Development data only — reproducible via `npm run seed`, never a backup.
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; healthy once this node is a writable primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  mongo-data:
