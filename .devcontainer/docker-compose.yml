services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:4-24-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Own network identity on purpose. With network_mode: service:mongo the private
    # Codespaces preview (https://<codespace>-5173.app.github.dev) returned 502 when no
    # VS Code session was attached; with this setup it reaches the dev server.
    environment:
      # These override the localhost defaults in .env (dotenv never overrides real env vars).
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      MONGODB_TEST_URI: mongodb://mongo:27017/?directConnection=true
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.2.12
    restart: unless-stopped
    # Single-node replica set: required for multi-document transactions (organization onboarding).
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      # Development data only — reproducible via `npm run seed`, never a backup.
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; healthy once this node is a writable primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  mongo-data:
