name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      CI: true
      MONGODB_TEST_URI: mongodb://localhost:27017/?directConnection=true

    steps:
      - uses: actions/checkout@v7

      # Diagnostics: MongoDB builds are sensitive to the runner kernel (see docs/PROGRESS.md).
      - name: Runner environment
        run: |
          echo "kernel: $(uname -r)"

      - name: Start MongoDB 8.2.12 (single-node replica set)
        run: bash scripts/ci/start-mongo.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify (lint, typecheck, unit + integration tests, build, e2e)
        run: npm run verify

      - name: MongoDB logs
        if: failure()
        run: docker logs mongo 2>&1 | tail -100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
