<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Rewritten to "index, follow" only for builds with VITE_PUBLIC_SITE_URL and VITE_PUBLIC_INDEXING=true. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="raclinic — مساعدك الذكي في كل تفاصيل العيادة. مساحة عمل سحابية للعيادات والمراكز الطبية في مصر والسعودية: سجل المرضى، جداول الأطباء، الحجز، تسجيل الوصول وقائمة الانتظار." />
    <meta name="theme-color" content="#122640" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- With credentials: behind an authenticating proxy (private previews) the manifest request needs the cookies too. -->
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <!-- Sets data-theme (saved choice or system) before anything paints; blocking on purpose. -->
    <script src="/theme-init.js"></script>
    <!-- The page colour before the stylesheet loads (no white flash in the dark theme); matches --bg. -->
    <style>
      html { background: #f5f8fa; }
      html[data-theme='dark'] { background: #0d1b2e; }
      /* Shown until the app mounts (UX-029): never an entirely blank frame. */
      .boot { display: grid; place-items: center; min-height: 100vh; }
      .boot img { width: 48px; height: 48px; opacity: 0.85; }
      @media (prefers-reduced-motion: no-preference) { .boot img { animation: boot 1.2s ease-in-out infinite alternate; } }
      @keyframes boot { to { opacity: 0.35; } }
    </style>
    <title>raclinic</title>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="raclinic"><img src="/favicon.svg" alt="" /></div></div>
    <noscript>
      <p>raclinic — مساعدك الذكي في كل تفاصيل العيادة. مساحة عمل سحابية للعيادات والمراكز الطبية في مصر والسعودية. يلزم تفعيل JavaScript لاستخدام الموقع.</p>
      <p lang="en" dir="ltr">raclinic — Smart clinic management. A cloud workspace for clinics and medical centers in Egypt and Saudi Arabia. JavaScript is required to use this site.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
